  {id:"c1", opts:[["ok", "    return nova_zac < stara_kon and stara_zac < nova_kon"], ["le", "    return nova_zac <= stara_kon and stara_zac <= nova_kon"], ["or", "    return nova_zac > stara_kon or stara_zac > nova_kon"]]},
  {id:"d2", fixed:""},
  {id:"d3", fixed:"def rezervuj(rezervacie, zac, kon):"},
  {id:"c2", opts:[["ok", "    if zac >= kon:"], ["gt", "    if zac > kon:"]]},
  {id:"d4", fixed:'        return "Chyba: začiatok musí byť pred koncom."'},
  {id:"d5", fixed:"    for stara_zac, stara_kon in rezervacie:"},
  {id:"d6", fixed:"        if prekryva_sa(stara_zac, stara_kon, zac, kon):"},
  {id:"c3", opts:[["ok", '            return "Obsadené."'], ["cont", "            continue"], ["print", '            print("Obsadené.")']]},
  {id:"d7", fixed:"    rezervacie.append((zac, kon))"},
  {id:"d8", fixed:'    return "Rezervované."'}
];
const HOURS_A = [{id:"ok", code:"if zac < 8 or kon > 22: return \"Chyba: mimo otváracích hodín.\""}, {id:"and", code:"if zac < 8 and kon > 22: return \"Chyba: mimo otváracích hodín.\""}, {id:"kon", code:"if kon > 23: return \"Chyba: mimo otváracích hodín.\""}];
function runA(c, zac, kon, hours, ex){
  ex = ex || (typeof ST !== "undefined" && ST && ST.vars && ST.vars.ex) || [[9, 11], [14, 15]];
  const pn = n => Number.isInteger(n) ? String(n) : String(n);
  if (!isFinite(zac) || !isFinite(kon)) return {code:"?", out:"Zadaj začiatok aj koniec ako číslo, napríklad 9 alebo 9.5."};
  const head = `>>> rezervacie = [${ex.map(r => `(${pn(r[0])}, ${pn(r[1])})`).join(", ")}]\n>>> rezervuj(rezervacie, ${pn(zac)}, ${pn(kon)})`;
  const bad = c.c2 === "gt" ? zac > kon : zac >= kon;
  if (bad) return {code:"CH", out:`${head}\n'Chyba: začiatok musí byť pred koncom.'`};
  if (hours){ const hit = hours === "ok" ? (zac < 8 || kon > 22) : hours === "and" ? (zac < 8 && kon > 22) : kon > 23; if (hit) return {code:"CH", out:`${head}\n'Chyba: mimo otváracích hodín.'`}; }
  const f = c.c1 === "or" ? ((az, ak, bz, bk) => bz > ak || az > bk) : (OVL_A.find(o => o.id === (c.c1 || "ok")) || OVL_A[0]).fn;
  let printed = false;
  for (const [a, b] of ex){
    if (f(a, b, zac, kon)){
      if (c.c3 === "print") printed = true;
      else if (c.c3 !== "cont") return {code:"O", out:`${head}\n'Obsadené.'`};
    }
  }
  return {code:"R", out:`${head}\n${printed ? "Obsadené.\n" : ""}'Rezervované.'`};
}
const TESTS_A = [[11, 12, "R"], [8, 9, "R"], [10, 12, "O"], [13, 16, "O"], [14, 15, "O"], [12, 12, "CH"], [16, 15, "CH"]];
const HOURS_TESTS = [[21, 23, "CH"], [7, 9, "CH"], [20, 22, "R"]];
const normA = s => { const t = String(s || "").trim().toUpperCase(); return t.startsWith("CH") ? "CH" : t.startsWith("R") ? "R" : t.startsWith("O") ? "O" : t; };

/* --- tutor: pokyny --- */
function tutorRules(L, ph){
  const lv = LV[level];
  const style = {p:"Hovoríš s dieťaťom vo veku 9–11 rokov. Píš veľmi jednoducho, krátkymi vetami, najviac 4 vety. Žiadne odborné slová bez vysvetlenia.", v:"Hovoríš so žiakom 11–15 rokov. Píš jasne, najviac 6 viet. Odborné pojmy používaj, ale vysvetli ich.", a:"Hovoríš so stredoškolákom. Správaj sa ako skúsený senior vývojár pri code review: vecne, konkrétne, najviac 6 viet."}[level] || "";
  return `Si AI tutor vo Vývojárskom štúdiu vzdelávacej aplikácie Programovo (informatika podľa ŠVP 2023). Odpovedaj po slovensky.
Žiak: úroveň ${lv.name} (${lv.cyc}, ${lv.grades}). ${style}
Zákazka od zadávateľa (${L.who}): ${briefOf(L)}
Aktuálna fáza ${L.phases.indexOf(ph) + 1}/${L.phases.length}: ${ph.title}. Úloha žiaka: ${ph.goal}
Práca žiaka v tejto fáze: ${phaseCtx(ph)}
Pravidlá:
- Si mentor, nie riešiteľ. NIKDY neprezraď hotové riešenie fázy, správne poradie ani hotový kód. Pýtaj sa otázky, ktoré žiaka privedú k riešeniu, a daj najviac jednu malú nápovedu naraz.
- Chváľ konkrétne, chyby pomenuj vecne a láskavo.
- Drž sa zákazky a informatiky. Ak sa žiak pýta na niečo iné, vľúdne ho vráť k práci.
- Nežiadaj osobné údaje (celé meno, adresu, telefón, školu). Ak ich žiak napíše, upozorni ho, že ich netreba písať.
- Ak je žiak smutný, nahnevaný alebo sa vzdáva, povzbuď ho a navrhni jeden malý ďalší krok.
- Nepoužívaj Markdown nadpisy ani tabuľky.`;
}
function phaseCtx(ph){
  const d = ST.data[ph.id] || {};
  try { return JSON.stringify(d).slice(0, 2500); } catch(e){ return "(nedostupné)"; }
}

  }
  wrap.append(el("div", {class:"order-commission", style:"margin-bottom:14px"}, el("div", {class:"eyebrow"}, `Zákazka · ${L.who}`), el("p", {style:"font-size:1.05rem;margin-top:4px"}, briefOf(L))));
  // fázy
  const steps = el("ol", {class:"steps", "aria-label":"Fázy vývoja"});
  L.phases.forEach((p, i) => {
    const done = ST.done.includes(p.id), cur = i === ST.phase, avail = done || i <= ST.done.length;

      el("span", {class:"step-n"}, done ? "✓" : String(i + 1)), el("span", null, p.title))));
  });
  wrap.append(el("div", {class:"steps-wrap"}, steps));
  if (ST.finished && ST.phase >= L.phases.length) ST.phase = L.phases.length - 1;
  const ph = L.phases[ST.phase];
  ST.data[ph.id] = Object.assign(ph.init(), ST.data[ph.id] || {});
  const grid = el("div", {class:"studio-grid"});
  const main = el("div", {class:"card"});
  const work = el("div", {class:"work"});
  const fb = el("div", {class:"subfb", "aria-live":"polite"});
  const upd = (patch, rerender = true) => { Object.assign(ST.data[ph.id], patch); stSave(); if (rerender) drawWork(); };
  function drawWork(){ work.innerHTML = ""; ph.render(work, ST.data[ph.id], upd); }
  drawWork();
  let hintI = 0;
  const hintBox = el("div");
  const bHint = el("button", {class:"btn", type:"button", onclick:() => { if (hintI < ph.hints.length){ hintBox.append(el("div", {class:"msg info"}, el("b", null, `Nápoveda ${hintI + 1}: `), ph.hints[hintI])); hintI++; } if (hintI >= ph.hints.length) bHint.disabled = true; }}, "Nápoveda");
  const bSubmit = el("button", {class:"btn primary", type:"button", onclick:() => {
    const r = ph.check(ST.data[ph.id]);
    fb.innerHTML = "";
    if (!r.ok){
      fb.append(el("div", {class:"msg bad"}, el("b", null, LV[level].young ? "Bit hovorí: ešte to nie je ono." : "Kontrola našla problémy:"), el("ul", null, r.msgs.map(m => el("li", null, m)))));
      if (r.back){ const bi = L.phases.findIndex(p => p.id === r.back); fb.append(el("button", {class:"btn", type:"button", onclick:() => { ST.phase = bi; stSave(); route(); }}, `Späť do fázy ${L.phases[bi].title}`)); }
      fb.classList.add("shake"); setTimeout(() => fb.classList.remove("shake"), 400);
      return;
    }
    if (r.file) addFile(r.file[0], r.file[1]);
    if (!ST.done.includes(ph.id)) ST.done.push(ph.id);
    const last = ST.phase === L.phases.length - 1;
    if (last){ ST.finished = true; } else ST.phase = Math.max(ST.phase + 1, Math.min(ST.done.length, L.phases.length - 1));
    stSave(); route(); window.scrollTo({top:0, behavior:reduced ? "auto" : "smooth"});
  }}, ST.phase === L.phases.length - 1 ? "Odovzdať zákazku" : "Odovzdať fázu");
  main.append(el("header", null, el("div", null, el("div", {class:"eyebrow"}, `Fáza ${ST.phase + 1} z ${L.phases.length}`), el("h3", null, ph.title)), ST.done.includes(ph.id) ? el("span", {class:"chip"}, "odovzdané ✓") : null),
    el("p", {class:"goal"}, ph.goal), work, el("div", {class:"ctrl"}, bSubmit, bHint), hintBox, fb);
  if (ST.finished && ST.phase === L.phases.length - 1) main.prepend(finishCard(L));
  grid.append(main);
  const side = el("div", {class:"side"});
  side.append(level === "u" ? bitCard(ph) : tutorCard(L, ph), folderCard());
  grid.append(side);
  wrap.append(grid);
  return wrap;
}
function finishCard(L){
  return el("div", {class:"msg ok finish"}, el("div", {class:"eyebrow"}, "Zákazka odovzdaná"),
    el("h3", null, `${L.who} ďakuje!`),
    el("p", null, `Prešiel/prešla si celou cestou vývoja – od nápadu až po ${L.phases[L.phases.length - 1].title.toLowerCase()}. Presne takto pracujú skutočné vývojárske tímy.`),
    el("div", {class:"ctrl"}, el("button", {class:"btn", type:"button", onclick:() => { save(SNAME[level], null); tutorTurns = []; route(); }}, "Nová zákazka s inými číslami")));
}
function bitCard(ph){
  return el("div", {class:"card"}, el("header", null, el("h3", null, "Robot Bit radí")),
    el("div", {class:"guide"}, el("div", {html:BIT_SVG}), el("div", {class:"bubble"}, ph.hints[0])),
    el("p", {class:"why"}, "Keď si nevieš rady, ťukni na „Nápoveda“. Bit ti pomôže krok za krokom."));

function tutorCard(L, ph){
  if (tutorPhase !== ph.id + level){ tutorTurns = []; tutorPhase = ph.id + level; }
  const card = el("div", {class:"card tutor"});
  const log = el("div", {class:"tlog", "aria-live":"polite"});
  const status = el("p", {class:"why"}, "Pripájam tutora…");
  const inp = el("textarea", {class:"inp", rows:"2", placeholder:"Napíš otázku tutorovi…", "aria-label":"Otázka pre tutora", maxlength:"600"});
  const bSend = el("button", {class:"btn primary small", type:"button"}, "Poslať");
  const bReview = el("button", {class:"btn small", type:"button"}, "Skontroluj moju prácu");
  const bStop = el("button", {class:"btn small", type:"button", hidden:true}, "Zastaviť");
  card.append(el("header", null, el("h3", null, level === "a" ? "Senior vývojár (AI)" : level === "v" ? "AI mentor" : "AI tutor"), el("span", {class:"chip"}, "neprezradí riešenie")),
    el("div", {class:"guide"}, el("div", {html:ADA_SVG}), el("div", {class:"bubble"}, level === "p" ? "Ahoj! Pomôžem ti otázkami. Riešenie ti nepoviem – to vymyslíš ty." : "Som tu, aby som ti kládla otázky a pomohla nájsť cestu. Hotové riešenie ti nedám.")),
    log, status, inp, el("div", {class:"ctrl"}, bSend, bReview, bStop));
  const draw = () => { log.innerHTML = ""; tutorTurns.forEach(t => log.append(el("div", {class:"tmsg " + t.role}, t.content))); log.scrollTop = log.scrollHeight; };
  draw();
  const setBusy = b => { bSend.disabled = b; bReview.disabled = b; inp.disabled = b; bStop.hidden = !b; };
  async function send(text){
    if (!text.trim()) return;
    if (PERSONAL.test(text)) { status.textContent = "Vyzerá to na osobný údaj (telefón, e-mail, rodné číslo). Tie tutorovi písať netreba – uprav správu."; return; }
    tutorTurns.push({role:"user", content:text.trim()}); draw();
    const bubble = el("div", {class:"tmsg assistant"}, "Premýšľam…"); log.append(bubble); log.scrollTop = log.scrollHeight;
    setBusy(true); tutorCtl = new AbortController();
    try {
      const turns = [{role:"user", content:tutorRules(L, ph)}, {role:"assistant", content:"Rozumiem. Budem viesť otázkami a neprezradím riešenie."}, ...tutorTurns.slice(-10)];
      const t = await Tutor.ask(turns, ({text}) => { bubble.textContent = text; log.scrollTop = log.scrollHeight; }, tutorCtl.signal);
      tutorTurns.push({role:"assistant", content:t}); status.textContent = "";
    } catch (e){
      bubble.remove(); tutorTurns.pop();
      const code = e && e.code;
      status.textContent = code === "cancelled" ? "" : code === "rate_limited" ? "Tutor je teraz zaneprázdnený. Skús to o chvíľu." : code === "unavailable" || code === "not_granted" || code === "sampling_disabled" ? "AI tutor tu nie je k dispozícii. Použi tlačidlo Nápoveda." : "Tutor neodpovedal. Skús to znova.";
      if (code === "not_granted" || code === "sampling_disabled") { bSend.hidden = true; bReview.hidden = true; inp.hidden = true; }
      draw();
    } finally { setBusy(false); }
  }
  bSend.onclick = () => { const v = inp.value; inp.value = ""; send(v); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); bSend.click(); } });
  bReview.onclick = () => send("Pozri sa na moju prácu v tejto fáze. Čo mám dobre a čo by som mal(a) zlepšiť? Neprezraď mi riešenie, len ma naveď.");
  bStop.onclick = () => tutorCtl && tutorCtl.abort();
  Tutor.mode().then(m => {
    if (!document.body.contains(card)) return;
    if (m === "none"){ status.textContent = "AI tutor tu nie je k dispozícii. Pomôže ti tlačidlo Nápoveda pri úlohe."; inp.hidden = true; bSend.hidden = true; bReview.hidden = true; }
    else status.textContent = m === "claude" ? "Tutor beží cez Claude. Pri prvej otázke ťa môže požiadať o súhlas." : "";
  });
  return card;
}
function folderCard(){

  const card = el("div", {class:"card"}, el("header", null, el("h3", null, "Projektová zložka"), el("span", {class:"chip"}, `${files.length} ${files.length === 1 ? "súbor" : files.length < 5 && files.length ? "súbory" : "súborov"}`)));
  if (!files.length){ card.append(el("p", {class:"why"}, "Každá odovzdaná fáza sem uloží súbor. Pozri, ako rastie tvoj projekt.")); return card; }
  const view = el("pre", {class:"termout", hidden:true});
  const list = el("div", {class:"flist fb"});
  files.forEach(f => {
    const ext = f.path.split(".").pop();
    list.append(el("button", {class:"fitem", type:"button", onclick:() => { view.hidden = false; view.textContent = `# ${f.path}\n\n${f.content}`; }},
      el("span", {class:"fi", style:`background:${ext === "py" ? "var(--b2)" : ext === "md" ? "var(--b1)" : "var(--b5)"}`, html:icon(ext === "py" ? "code" : "doc", 18)}), el("span", {class:"mono", style:"font-size:.82rem;overflow-wrap:anywhere"}, f.path), el("small")));
  });
  card.append(list, view);
  return card;
}
