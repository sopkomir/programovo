<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Digitálne mesto Programovo – interaktívna aplikácia o softvéri pre žiakov ZŠ a SŠ podľa ŠVP 2023: operačný systém, aplikácie, súbory, škodlivý softvér, prvé programy a Vývojárske štúdio s AI tutorom.">
<meta property="og:title" content="Programovo – digitálne mesto, v ktorom bývajú programy">
<meta property="og:description" content="Interaktívna aplikácia o softvéri pre 1.–3. cyklus ZŠ a strednú školu. Zadarmo na Zavretej škole.">
<meta property="og:image" content="https://sopkomir.github.io/programovo/hero.png">
<meta property="og:type" content="website">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Digitálne mesto Programovo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mapa mesta ako plošný plán s cestami-vodičmi; štvrte = budovy; detail štvrte = stĺpec kariet (intro, výklad, dielňa, kvíz) */
:root{
  --bg:#EDF2F8; --surface:#FFFFFF; --surface-2:#E2E9F2; --ink:#17203A; --muted:#55627E; --line:#C8D2E1;
  --accent:#E2560C; --accent-ink:#FFFFFF; --teal:#0C8584; --ok:#1C8E4E; --ok-bg:#E1F4E8; --bad:#C9353A; --bad-bg:#FBE5E5;
  --ground:#DCE6D9; --road:#B7C3D5; --via:#8FA0B9; --window:#FFF4C9;
  --b1:#4F7FE6; --b2:#21A396; --b3:#EE8434; --b4:#D9506E; --b5:#7E8FB0; --b6:#E8B828;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:18px;
  --sky1:#D6E9FB; --sky2:#EDF6EA; --grass:#A6D88C; --tree:#4FA36A; --soil:#C39A6B; --soil-2:#9C7350; --asphalt:#5B6578; --curb:#E6EBF2; --plaza:#EEEDE4; --paint:#F4F6F9;
  --glass:#CDE5F7; --glass2:#AFCFEA; --lit:#D9ECFA; --wall:#F5F7FA; --shade:rgba(25,40,70,.16); --lamp:#FFE7A3; --smoke:#FFFFFF;
  --sig-off:#3B4458; --sig-r:#FF4D4D; --sig-y:#FFC23D; --sig-g:#3DDC84; --star-o:0; --cloud-o:.92; --glow-o:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#172038; --surface-2:#202B47; --ink:#E7ECF6; --muted:#9BA9C5; --line:#2E3B5E;
    --accent:#FF7A33; --accent-ink:#1A0E05; --teal:#3CC3B6; --ok:#4CC984; --ok-bg:#163526; --bad:#FF6B6F; --bad-bg:#3D1C22;
    --ground:#1B2A2C; --road:#34425F; --via:#56688C; --window:#F6D872;
    --b1:#6C95F0; --b2:#33BBAD; --b3:#F49A52; --b4:#E46A86; --b5:#8E9DBB; --b6:#EDC548;
    --sky1:#0A1022; --sky2:#161D38; --grass:#2D5843; --tree:#2F7454; --soil:#4B3B33; --soil-2:#382C26; --asphalt:#2A3245; --curb:#47536B; --plaza:#3A4258; --paint:#B9C3D6;
    --glass:#2B3753; --glass2:#222C45; --lit:#FFC95E; --wall:#C7CFDE; --shade:rgba(0,0,0,.38); --lamp:#FFD27A; --smoke:#8C97AE; --sig-off:#1B2232; --star-o:.9; --cloud-o:0; --glow-o:.85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#0A1022; --sky2:#161D38; --grass:#2D5843; --tree:#2F7454; --soil:#4B3B33; --soil-2:#382C26; --asphalt:#2A3245; --curb:#47536B; --plaza:#3A4258; --paint:#B9C3D6;
  --glass:#2B3753; --glass2:#222C45; --lit:#FFC95E; --wall:#C7CFDE; --shade:rgba(0,0,0,.38); --lamp:#FFD27A; --smoke:#8C97AE; --sig-off:#1B2232; --star-o:.9; --cloud-o:0; --glow-o:.85;
  --bg:#0E1424; --surface:#172038; --surface-2:#202B47; --ink:#E7ECF6; --muted:#9BA9C5; --line:#2E3B5E;
  --accent:#FF7A33; --accent-ink:#1A0E05; --teal:#3CC3B6; --ok:#4CC984; --ok-bg:#163526; --bad:#FF6B6F; --bad-bg:#3D1C22;
  --ground:#1B2A2C; --road:#34425F; --via:#56688C; --window:#F6D872;
  --b1:#6C95F0; --b2:#33BBAD; --b3:#F49A52; --b4:#E46A86; --b5:#8E9DBB; --b6:#EDC548;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem, 5vw, 2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{flex:none}
.brand p{color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;width:min(100%,560px)}
.lv{border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;text-align:center;display:grid;gap:1px}
.lv b{font-family:var(--f-display);font-size:1rem}
.lv span{font-size:.72rem;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.lv[aria-pressed="true"] b{color:var(--accent)}
@media (max-width:520px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* city */
.city{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.city{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}}
.mapbox{background:var(--surface);border-radius:var(--r);padding:10px;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.bld{cursor:pointer}
.bld .hit{fill:transparent}
.bld:hover .body, .bld:focus-visible .body{filter:brightness(1.08)}
.bld:focus{outline:none}
.bld:focus-visible .hit{stroke:var(--accent);stroke-width:3;stroke-dasharray:6 4}
.maplabel{font-family:var(--f-display);font-weight:700;font-size:12.5px;fill:var(--ink)}
.maplabel-sub{font-size:9.5px;fill:var(--muted);font-family:var(--f-body)}
.dlist{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.dcard:hover{border-color:var(--accent)}
.dcard .sw{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff}
.dcard h3{font-size:1.02rem}
.dcard p{font-size:.86rem;color:var(--muted)}
.stat{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* district view */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;display:inline-flex;gap:7px;align-items:center;min-height:42px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 10px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700}
.dgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dgrid .wide{grid-column:1 / -1}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.dhead .sw{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}

/* intro stage */
.stage{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.stage{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}}
.scene{background:var(--surface-2);border-radius:12px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.caps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:c}
.caps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;opacity:0;transform:translateY(6px);animation:capIn .5s ease forwards;animation-delay:var(--d)}
.caps li::before{counter-increment:c;content:counter(c);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem}
@keyframes capIn{to{opacity:1;transform:none}}
.s-pop{opacity:0;transform-box:fill-box;transform-origin:center bottom;animation:sPop .55s cubic-bezier(.3,1.4,.6,1) forwards;animation-delay:var(--d,0s)}
@keyframes sPop{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:none}}
.s-fade{opacity:0;animation:sFade .6s ease forwards;animation-delay:var(--d,0s)}
@keyframes sFade{to{opacity:1}}
.s-slide{opacity:0;animation:sSlide .8s ease forwards;animation-delay:var(--d,0s)}
@keyframes sSlide{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.s-drop{opacity:0;animation:sDrop .7s ease forwards;animation-delay:var(--d,0s)}
@keyframes sDrop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.s-blink{animation:sBlink 1.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sBlink{0%,100%{opacity:.25}50%{opacity:1}}
.s-bounce{animation:sBounce 2.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sBounce{0%,40%{transform:translateX(0)}55%{transform:translateX(70px)}62%{transform:translateX(52px)}100%{transform:translateX(0)}}
.s-walk{animation:sWalk 3s steps(1) infinite;animation-delay:var(--d,0s)}
@keyframes sWalk{0%{transform:translate(0,0)}25%{transform:translate(40px,0)}50%{transform:translate(80px,0)}75%{transform:translate(80px,40px)}100%{transform:translate(0,0)}}
.s-down{animation:sDown 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sDown{0%{transform:translateY(0)}100%{transform:translateY(112px)}}
.s-slice{animation:sSlice 1.8s steps(1) infinite}
@keyframes sSlice{0%{transform:translateX(0)}33%{transform:translateX(70px)}66%{transform:translateX(140px)}}

/* learn */
.guide{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start}
.bubble{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:.95rem}
.learn{display:grid;gap:10px;max-width:68ch}
.learn ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.learn strong{color:var(--accent)}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{background:var(--surface-2);border-radius:8px;padding:3px 9px;font-size:.85rem;font-weight:700}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.speak[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;padding:7px 9px;border-radius:9px;color:var(--muted)}
.tasks li.cur{background:var(--surface-2);color:var(--ink);font-weight:700}
.tasks li.done{color:var(--ok)}
.tasks li .tick{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:.75rem}
.tasks li.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.inlineq{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg{border-radius:10px;padding:10px 12px;font-size:.95rem}
.msg.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.msg.info{background:var(--surface-2)}
.win{animation:winIn .35s ease}
@keyframes winIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* OS desktop */
.desk{background:linear-gradient(160deg, var(--b1), var(--b2));border-radius:12px;padding:12px;display:grid;gap:12px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ico{border:0;background:rgb(255 255 255 / .14);border-radius:10px;padding:8px 4px;color:#fff;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:.78rem;font-weight:700;text-shadow:0 1px 2px rgb(0 0 0 / .35)}
.ico:hover{background:rgb(255 255 255 / .26)}
.ico .gl{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.ico.doc .gl{border-radius:4px}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;min-height:56px}
.wins .empty{color:#fff;opacity:.85;font-size:.85rem;align-self:center}
.w{background:var(--surface);border-radius:8px;overflow:hidden;box-shadow:0 3px 10px rgb(0 0 0 / .25)}
.w .tb{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 4px 8px;color:#fff;font-size:.8rem;font-weight:700}
.w .tb button{border:0;background:rgb(0 0 0 / .2);color:#fff;border-radius:6px;width:30px;height:28px;cursor:pointer;font-weight:700}
.w .wb{padding:8px;font-size:.8rem;color:var(--muted);min-height:34px}
.ram{display:grid;gap:6px}
.ramtrack{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.ramcell{height:26px;border-radius:5px;background:var(--surface-2);border:1px dashed var(--line);display:grid;place-items:center;font-size:.68rem;color:#fff;font-weight:700;overflow:hidden}
.tm{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tm th,.tm td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.cpu{display:flex;gap:4px;align-items:center;font-size:.8rem;flex-wrap:wrap}
.cpu .slot{padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:700;transition:background .2s}
.cpu .slot.on{color:#fff}

/* sorter */
.deck{display:grid;gap:12px}
.cardbig{border:2px solid var(--line);border-radius:14px;padding:18px;text-align:center;display:grid;gap:4px;background:var(--surface-2)}
.cardbig b{font-family:var(--f-display);font-size:1.5rem}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bucket{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;display:grid;gap:2px;text-align:center}
.bucket:hover{border-color:var(--accent)}
.bucket b{font-family:var(--f-display)}
.bucket span{font-size:.78rem;color:var(--muted)}
.progressbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--teal);transition:width .3s}

/* file browser */
.fb{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 10px;background:var(--surface-2);font-size:.88rem}
.crumbs button{border:0;background:transparent;font-weight:700;cursor:pointer;padding:2px 4px;border-radius:5px}
.crumbs .sep{color:var(--muted)}
.pathline{padding:6px 10px;font-family:var(--f-mono);font-size:.8rem;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.flist{display:grid}
.fitem{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
.fitem:last-child{border-bottom:0}
.fitem:hover{background:var(--surface-2)}
.fitem .fi{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:#fff}
.fitem small{color:var(--muted);font-variant-numeric:tabular-nums}
.fitem.sel{outline:3px solid var(--accent);outline-offset:-3px}

/* triage */
.scen{border-radius:14px;padding:16px;background:var(--surface-2);font-size:1.05rem;display:grid;gap:6px}

/* kitchen */
.kitchen{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.kitchen{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.grid{position:relative;display:grid;gap:4px;background:var(--surface-2);padding:6px;border-radius:12px;max-width:380px;width:100%;margin:0 auto}
.cell{aspect-ratio:1;border-radius:7px;background:var(--surface);display:grid;place-items:center;max-width:100%}
.cell.wall{background:repeating-linear-gradient(45deg,var(--b5) 0 6px, var(--line) 6px 12px)}
.cell.start{box-shadow:inset 0 0 0 2px var(--teal)}
.botwrap{position:absolute;display:grid;place-items:center;transition:left .35s ease, top .35s ease;pointer-events:none}
.botwrap svg{transition:transform .3s ease;width:80%;height:80%}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.cmd{border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;color:#fff;display:inline-flex;gap:6px;align-items:center;min-height:40px}
.c-F{background:var(--b1)}.c-L{background:var(--b2)}.c-R{background:var(--b2)}.c-T{background:var(--b3)}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:12px;align-content:flex-start}
.blk{display:inline-flex;align-items:center;gap:4px;border-radius:9px;padding:4px 4px 4px 10px;color:#fff;font-weight:700;font-size:.9rem}
.blk.run{outline:3px solid var(--ink);outline-offset:1px}
.blk button{border:0;background:rgb(0 0 0 / .22);color:#fff;border-radius:6px;min-width:28px;height:28px;cursor:pointer;font-weight:700}
.blk .n{min-width:22px;text-align:center}
.code{background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:.85rem;overflow-x:auto;margin:0;line-height:1.6}
.code .ln{display:block;padding:0 6px;border-radius:4px;white-space:pre}
.code .ln.on{background:var(--accent);color:var(--accent-ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px}

/* underground */
.layers{display:grid;gap:6px}
.layer{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);opacity:.5;transition:opacity .3s, transform .3s}
.layer.on{opacity:1;transform:translateX(4px);box-shadow:inset 4px 0 0 var(--accent)}
.layer.past{opacity:.85}

/* ---------- reč (len ručne) ---------- */
let speaking = null;
function speakBtn(getText){
  const b = el("button", {class:"speak", type:"button", "aria-label":"Prečítaj nahlas", "aria-pressed":"false", html:icon("speaker", 20)});
  b.addEventListener("click", () => {
    try {
      const ss = window.speechSynthesis;
      if (!ss){ b.disabled = true; return; }
      if (speaking === b){ ss.cancel(); speaking = null; b.setAttribute("aria-pressed","false"); return; }
      ss.cancel(); document.querySelectorAll(".speak").forEach(x => x.setAttribute("aria-pressed","false"));
      const u = new SpeechSynthesisUtterance(getText().replace(/\s+/g, " "));
      u.lang = "sk-SK"; u.rate = .95;
      const v = ss.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("sk"));
      if (v) u.voice = v;
      u.onend = () => { b.setAttribute("aria-pressed","false"); speaking = null; };
      speaking = b; b.setAttribute("aria-pressed","true"); ss.speak(u);
    } catch(e){ b.disabled = true; }
  });
  return b;
}

  learn:{
    u:`<p>Na radnici sedí <strong>starosta</strong> mesta. Aj počítač, tablet a mobil majú svojho starostu. Volá sa <strong>operačný systém</strong>.</p><ul><li>Na <strong>pracovnej ploche</strong> sú <strong>ikony</strong>. Ikona je obrázok, ktorý znamená aplikáciu alebo dokument.</li><li>Keď na ikonu ťukneš, starosta spustí <strong>aplikáciu</strong> a ukáže ju v <strong>okne</strong>.</li><li>Keď aplikáciu nepotrebuješ, okno zavri. Aplikácia skončí.</li></ul>`,
    p:`<p><strong>Operačný systém</strong> je program, ktorý sa spustí ako prvý, keď zapneš počítač, tablet alebo mobil. Príklady: Windows, Android, iOS, macOS, Linux.</p><ul><li>Stará sa o to, aby aplikácie mohli používať obrazovku, klávesnicu, myš aj pamäť.</li><li>Ikona môže znamenať <strong>aplikáciu</strong> (napríklad Kreslenie) alebo <strong>dokument</strong> (napríklad vylet.jpg). Keď otvoríš dokument, operačný systém spustí aplikáciu, ktorá s ním vie pracovať.</li><li>Aplikácia nefunguje bez operačného systému – tak ako obchod nefunguje bez mesta, ciest a elektriny.</li></ul>`,
    v:`<p><strong>Operačný systém (OS)</strong> je softvér, ktorý spravuje celý počítač. Aplikácie s hardvérom nehovoria priamo, ale cez OS.</p><ul><li><strong>Procesy:</strong> spustený program je proces. OS mu pridelí <strong>čas procesora</strong> a procesy rýchlo strieda.</li><li><strong>Pamäť:</strong> bežiaci program je v pamäti <strong>RAM</strong> (pracovný stôl). Uložené programy a súbory sú na <strong>disku</strong> (sklad). Keď RAM nestačí, nový program sa nemusí spustiť.</li><li><strong>Súbory a zariadenia:</strong> OS ukladá súbory a cez <strong>ovládače</strong> komunikuje s tlačiarňou, myšou či kamerou.</li><li><strong>Používatelia:</strong> prihlásenie, účty a oprávnenia.</li></ul>`,
    a:`<p>Jadro operačného systému (<strong>kernel</strong>) beží v privilegovanom režime. Aplikácie bežia v používateľskom režime a o prístup k hardvéru žiadajú <strong>systémovým volaním</strong>.</p><ul><li><strong>Plánovač procesov</strong> prideľuje procesom časové kvantá – na jednom jadre sa procesy striedajú, na viacerých môžu bežať naozaj súbežne.</li><li><strong>Správa pamäte:</strong> každý proces má vlastný adresný priestor. Pri nedostatku RAM OS presúva stránky pamäte na disk (<strong>odkladací priestor, swap</strong>) – počítač sa spomalí.</li><li><strong>Ovládače</strong> prekladajú všeobecné požiadavky OS na príkazy konkrétneho zariadenia. Zariadenia ohlasujú udalosti <strong>prerušením</strong>.</li><li>Správca úloh ukazuje procesy, ich pamäť a záťaž procesora.</li></ul>`},

  learn:{

    p:`<p>Každá budova na Hlavnej ulici je <strong>aplikácia</strong> na niečo iné: kreslenie, písanie, prezentácie, hudbu, hry, učenie.</p><ul><li><strong>Hardvér</strong> = zariadenia a súčiastky. <strong>Softvér</strong> = programy. <strong>Súbor</strong> = to, čo si v programe vytvoríš a uložíš.</li><li>Softvér je <strong>výsledok práce ľudí</strong>. Preto platené hry a programy nekopírujeme bez dovolenia.</li><li>Pre každú úlohu si vyberáme vhodnú aplikáciu.</li></ul>`,
    v:`<p><strong>Program</strong> je postupnosť presných inštrukcií, ktoré vykonáva procesor. Softvér tvoria programy spolu s údajmi a dokumentáciou.</p><ul><li><strong>Systémový softvér:</strong> operačný systém, ovládače, nástroje na správu počítača.</li><li><strong>Aplikačný softvér:</strong> textový editor, grafický program, prehliadač, hry, vzdelávacie aplikácie.</li><li><strong>Licencie:</strong> platený softvér, <strong>freeware</strong> (zadarmo, ale bez práva meniť ho), <strong>open source</strong> (zdrojový kód je verejný a smie sa upravovať podľa licencie).</li><li>Softvér je autorské dielo – kopírovanie bez licencie je porušenie práva.</li></ul>`,

  learn:{
    u:`<p><strong>Vírus</strong> je zlý program. Niekto ho naprogramoval, aby škodil – mazal obrázky alebo kradol heslá.</p><ul><li>Neklikaj na neznáme odkazy a reklamy, ktoré sľubujú darčeky.</li><li>Hry a aplikácie inštaluj len s dospelým.</li><li><strong>Antivírus</strong> je ako lekár. Hľadá zlé programy a zastaví ich.</li></ul>`,
    p:`<ul><li><strong>Vírus</strong> je škodlivý program. Šíri sa napríklad cez súbory z neznámych stránok alebo prílohy.</li><li><strong>Špehovanie</strong>: aplikácia potajomky zbiera údaje, ktoré nepotrebuje – kontakty, polohu, mikrofón.</li><li>Inštaluj len z dôveryhodných zdrojov (oficiálny obchod s aplikáciami) a s dovolením dospelého.</li><li><strong>Aktualizácie</strong> sú ako očkovanie – opravujú chyby, cez ktoré by sa vírus dostal dnu.</li></ul>`,

/* ---------- izometrická dioráma ---------- */
const ISO = (() => {
  const A = 17.32, B = 10, H = 15, OX = 214, OY = 112;
  const W = (c, p = 76) => `color-mix(in oklab, ${c} ${p}%, white)`;
  const K = (c, p = 74) => `color-mix(in oklab, ${c} ${p}%, black)`;
  const P = (x, y, z = 0) => [OX + (x - y) * A, OY + (x + y) * B - z * H];
  function canvas(){
    const out = [];
    const bb = {x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity};
    const pt = (x, y, z = 0) => { const p = P(x + c.dx, y + c.dy, z); if (p[0] < bb.x0) bb.x0 = p[0]; if (p[0] > bb.x1) bb.x1 = p[0]; if (p[1] < bb.y0) bb.y0 = p[1]; if (p[1] > bb.y1) bb.y1 = p[1]; return p; };
    const ps = arr => arr.map(a => pt(a[0], a[1], a[2] || 0).map(n => n.toFixed(1)).join(",")).join(" ");
    const c = {
      dx:0, dy:0, out, bb, pt,
      poly(arr, fill, attrs = ""){ out.push(`<polygon points="${ps(arr)}" style="fill:${fill}" ${attrs}/>`); },
      raw(s){ out.push(s); },
      line(a, b, stroke, w = 1.4, extra = ""){ const p = pt(...a), q = pt(...b); out.push(`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" style="stroke:${stroke};stroke-width:${w};stroke-linecap:round" ${extra}/>`); },
      box(x0, y0, x1, y1, z0, z1, col, o = {}){
        const a = o.attrs || "";
        c.poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], o.left || col, a);
        c.poly([[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]], o.right || K(col), a);
        c.poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], o.top || W(col), a);
      },
      winS(x0, x1, y, z0, z1, cols, rows, seed = 1){
        const w = (x1 - x0) / cols, h = (z1 - z0) / rows;
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
          const a = x0 + i * w + w * .16, b = x0 + (i + 1) * w - w * .16, za = z0 + j * h + h * .2, zb = z0 + (j + 1) * h - h * .14;
          const lit = ((i * 7 + j * 13 + seed * 5) % 5) < 2;
          c.poly([[a,y,za],[b,y,za],[b,y,zb],[a,y,zb]], lit ? "var(--lit)" : "var(--glass)");
        }
      },
      winE(y0, y1, x, z0, z1, cols, rows, seed = 1){
        const w = (y1 - y0) / cols, h = (z1 - z0) / rows;
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++){
          const a = y0 + i * w + w * .16, b = y0 + (i + 1) * w - w * .16, za = z0 + j * h + h * .2, zb = z0 + (j + 1) * h - h * .14;
          const lit = ((i * 11 + j * 3 + seed * 7) % 5) < 2;
          c.poly([[x,a,za],[x,b,za],[x,b,zb],[x,a,zb]], lit ? "var(--lit)" : "var(--glass2)");
        }
      },
      shadow(x0, y0, x1, y1, h){
        const k = Math.min(1.5, h * .5);
        c.poly([[x1,y0,0],[x1 + k,y0 + k * .3,0],[x1 + k,y1 + k * .3,0],[x0 + k * .5,y1 + k * .3,0],[x0,y1,0]], "var(--shade)");
      },
      plaza(x0, y0, x1, y1){ c.box(x0, y0, x1, y1, 0, .07, "var(--plaza)", {top:"var(--plaza)", left:K("var(--plaza)", 88), right:K("var(--plaza)", 80)}); },
      faceText(x, y, z, str, face, size, fill){
        const p = pt(x, y, z);
        const m = face === "S" ? `matrix(.866,.5,0,1,${p[0].toFixed(1)},${p[1].toFixed(1)})` : `matrix(.866,-.5,0,1,${p[0].toFixed(1)},${p[1].toFixed(1)})`;
        out.push(`<text transform="${m}" text-anchor="middle" style="fill:${fill};font:800 ${size}px var(--f-mono)">${str}</text>`);
      }
    };
    return c;
  }

      c.winE(1.4, 3.6, 3.9, .45, 2.35, 5, 2, 2);
      c.box(1.3, 3.55, 3.9, 3.72, 2.5, 2.7, W("var(--b1)", 60));
      c.box(3.75, 1.3, 3.92, 3.72, 2.5, 2.7, W("var(--b1)", 60));

      c.poly([[2.35,3.71,.26],[2.85,3.71,.26],[2.85,3.71,1.25],[2.35,3.71,1.25]], K("var(--b1)", 45));
      c.box(2.1, 3.9, 2.24, 4.04, .26, 1.5, "var(--wall)");

      const cl = []; for (let k = 0; k < 16; k++){ const t = k / 16 * Math.PI * 2; cl.push([2.6 + Math.cos(t) * .26, 2.902, 3.75 + Math.sin(t) * .34]); }
      c.poly(cl, "var(--surface)");
      c.line([2.6, 2.903, 3.75], [2.6, 2.903, 4.0], "var(--ink)", 1.3);
      c.line([2.6, 2.903, 3.75], [2.75, 2.903, 3.75], "var(--ink)", 1.3);

        c.box(x0 + .16, y0 + .16, x1 - .16, y1 - .16, h, h + .16, "var(--surface)", {top:"var(--surface)"});

      c.poly([[.75,8.05,1.0],[1.7,8.05,1.0],[1.7,8.35,.78],[.75,8.35,.78]], "var(--accent)");

    sklad(c){

      c.poly([[11.6,1.2,1.5],[11.6,4.0,1.5],[11.6,2.6,2.45]], K("var(--b6)", 72));
      for (let k = 1; k < 7; k++){ const x = 9.2 + k * .343; c.line([x, 4.0, 1.5], [x, 2.6, 2.45], K("var(--b5)", 80), .8); }
      [[9.5, 10.25], [10.55, 11.3]].forEach(([a, b]) => {
        c.poly([[a,4.001,.07],[b,4.001,.07],[b,4.001,1.15],[a,4.001,1.15]], K("var(--b6)", 62));
        for (let z = .25; z < 1.15; z += .18) c.line([a, 4.002, z], [b, 4.002, z], K("var(--b6)", 45), .7);

      c.box(9.25, 4.08, 9.7, 4.42, .07, .42, "var(--b3)");

      const ap = c.pt(8.85, 8.5, 2.8); c.raw(`<circle cx="${ap[0].toFixed(1)}" cy="${ap[1].toFixed(1)}" r="2.6" style="fill:var(--accent)"/>`);
      const sm = c.pt(10.18, 8.02, 2.7);
      c.raw(`<g class="smoke"><circle cx="${sm[0].toFixed(1)}" cy="${sm[1].toFixed(1)}" r="3" /><circle cx="${(sm[0] + 3).toFixed(1)}" cy="${(sm[1] - 7).toFixed(1)}" r="4"/><circle cx="${(sm[0] + 1).toFixed(1)}" cy="${(sm[1] - 15).toFixed(1)}" r="3.2"/></g>`);
    },
    podzemie(c){
      c.plaza(9.35, 9.35, 11.85, 11.85);
      c.poly([[10.0,10.0,.072],[11.2,10.0,.072],[11.2,10.95,.072],[10.0,10.95,.072]], K("var(--asphalt)", 55));
      c.poly([[10.0,10.0,.07],[10.0,10.95,.07],[10.0,10.95,-.8],[10.0,10.0,-.8]], K("var(--plaza)", 60));
      for (let k = 5; k >= 0; k--){
        const yA = 10.95 - (k + 1) * .158, yB = 10.95 - k * .158, z = .07 - k * .14;
        c.poly([[10.0,yA,z],[11.2,yA,z],[11.2,yB,z],[10.0,yB,z]], k % 2 ? W("var(--b5)", 70) : W("var(--b5)", 55));
        c.poly([[10.0,yB,z],[11.2,yB,z],[11.2,yB,z + .14],[10.0,yB,z + .14]], K("var(--b5)", 70));
      }
      c.box(9.95, 10.9, 10.05, 11.0, .07, 1.3, "var(--b5)");
      c.box(11.15, 10.9, 11.25, 11.0, .07, 1.3, "var(--b5)");
      c.box(9.85, 9.9, 11.35, 11.05, 1.3, 1.4, "var(--glass)", {left:"color-mix(in oklab, var(--glass) 70%, var(--b1))", top:"color-mix(in oklab, var(--glass) 75%, white)", attrs:'style="opacity:.92"'});
      c.box(11.48, 11.42, 11.56, 11.5, .07, 1.5, "var(--ink)");
      c.box(11.3, 11.3, 11.7, 11.62, 1.5, 1.66, "var(--b3)");
      c.box(11.3, 11.3, 11.7, 11.62, 1.66, 1.82, "var(--b1)");
      c.box(11.3, 11.3, 11.7, 11.62, 1.82, 1.98, "var(--b2)");
    }
  };
  function tree(c, x, y, s = 1){
    const g = c.pt(x + .12, y + .08, 0);
    c.raw(`<ellipse cx="${g[0].toFixed(1)}" cy="${g[1].toFixed(1)}" rx="${(9 * s).toFixed(1)}" ry="${(4 * s).toFixed(1)}" style="fill:var(--shade)"/>`);
    c.box(x - .05, y - .05, x + .05, y + .05, 0, .5 * s, "var(--soil-2)");
    const p = c.pt(x, y, .95 * s);
    c.raw(`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(9 * s).toFixed(1)}" style="fill:var(--tree)"/><circle cx="${(p[0] - 2.4 * s).toFixed(1)}" cy="${(p[1] - 2.8 * s).toFixed(1)}" r="${(5.4 * s).toFixed(1)}" style="fill:${W("var(--tree)", 72)}"/>`);
    c.pt(x, y, 1.6 * s);
  }
  function lamp(c, x, y){
    c.box(x - .025, y - .025, x + .025, y + .025, 0, 1.25, "var(--b5)");
    const p = c.pt(x, y, 1.3);
    c.raw(`<circle class="glow" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9"/><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2" style="fill:var(--lamp)"/>`);
  }
  function signal(c, x, y, id){
    c.box(x - .03, y - .03, x + .03, y + .03, .07, 1.35, "var(--ink)");
    const p = c.pt(x, y, 1.35);
    c.raw(`<rect x="${(p[0] - 3.6).toFixed(1)}" y="${(p[1] - 17).toFixed(1)}" width="7.2" height="17" rx="2.5" style="fill:var(--ink)"/>` +
      ["r", "y", "g"].map((k, i) => `<circle id="sig-${id}-${k}" cx="${p[0].toFixed(1)}" cy="${(p[1] - 13 + i * 4.6).toFixed(1)}" r="1.7" style="fill:var(--sig-off)"/>`).join(""));
  }

  /* --- mesto --- */
  const PLACES = {
    radnica:{label:"Radnica", at:[2.6, 2.5, 6.6], key:8.6},
    studio:{label:"Štúdio", at:[7.9, 2.4, 4.4], key:12.3, locked:true},
    sklad:{label:"Sklad", at:[11.0, 2.4, 3.0], key:15.6},
    ulica:{label:"Hlavná ulica", at:[2.55, 7.5, 3.4], key:11.4},
    nemocnica:{label:"Nemocnica", at:[3.2, 11.0, 2.3], key:15.3},
    kuchyna:{label:"Robotická kuchyňa", at:[10.25, 7.65, 3.0], key:19.0, off:[.6, -.65]},
    podzemie:{label:"Podzemie", at:[7.85, 10.6, 1.7], key:19.8, off:[-2.75, 0]}
  };
  function ground(c){
    c.box(0, 0, 12, 12, -.6, 0, "var(--soil)", {top:"var(--grass)", left:"var(--soil)", right:"var(--soil-2)"});
    c.poly([[0,12,-.6],[12,12,-.6],[12,12,-.48],[0,12,-.48]], K("var(--soil)", 80));
    c.poly([[12,0,-.6],[12,12,-.6],[12,12,-.48],[12,0,-.48]], K("var(--soil-2)", 80));
    c.poly([[0,5,.02],[12,5,.02],[12,6,.02],[0,6,.02]], "var(--asphalt)");
    c.poly([[5,0,.02],[6,0,.02],[6,12,.02],[5,12,.02]], "var(--asphalt)");
    const curb = (x0, y0, x1, y1) => c.box(x0, y0, x1, y1, 0, .06, "var(--curb)", {top:"var(--curb)"});
    curb(0, 4.78, 5.0, 5.0); curb(6.0, 4.78, 12, 5.0);
    curb(4.78, 0, 5.0, 4.78); curb(6.0, 0, 6.22, 4.78);
    curb(4.78, 6.22, 5.0, 12); curb(6.0, 6.22, 6.22, 12);
    curb(0, 6.0, 5.0, 6.22); curb(6.0, 6.0, 12, 6.22);
    for (let x = .25; x < 3.9; x += .62) c.poly([[x,5.475,.03],[x + .32,5.475,.03],[x + .32,5.525,.03],[x,5.525,.03]], "var(--paint)");
    for (let x = 7.1; x < 11.8; x += .62) c.poly([[x,5.475,.03],[x + .32,5.475,.03],[x + .32,5.525,.03],[x,5.525,.03]], "var(--paint)");
    for (let y = .25; y < 3.9; y += .62) c.poly([[5.475,y,.03],[5.525,y,.03],[5.525,y + .32,.03],[5.475,y + .32,.03]], "var(--paint)");
    for (let y = 7.1; y < 11.8; y += .62) c.poly([[5.475,y,.03],[5.525,y,.03],[5.525,y + .32,.03],[5.475,y + .32,.03]], "var(--paint)");
    for (let k = 0; k < 5; k++){
      const a = 5.06 + k * .19, b = a + .1;
      c.poly([[4.3,a,.03],[4.72,a,.03],[4.72,b,.03],[4.3,b,.03]], "var(--paint)");
      c.poly([[6.28,a,.03],[6.7,a,.03],[6.7,b,.03],[6.28,b,.03]], "var(--paint)");
      c.poly([[a,4.3,.03],[b,4.3,.03],[b,4.72,.03],[a,4.72,.03]], "var(--paint)");
      c.poly([[a,6.28,.03],[b,6.28,.03],[b,6.7,.03],[a,6.7,.03]], "var(--paint)");
    }
    // stopčiary v pravých pruhoch
    c.poly([[4.18,5.5,.03],[4.24,5.5,.03],[4.24,6,.03],[4.18,6,.03]], "var(--paint)");
    c.poly([[6.76,5,.03],[6.82,5,.03],[6.82,5.5,.03],[6.76,5.5,.03]], "var(--paint)");
    c.poly([[5,4.18,.03],[5.5,4.18,.03],[5.5,4.24,.03],[5,4.24,.03]], "var(--paint)");
    c.poly([[5.5,6.76,.03],[6,6.76,.03],[6,6.82,.03],[5.5,6.82,.03]], "var(--paint)");
  }
  function decor(){
    const o = [];
    const T = [[.45,.5,1],[4.55,.75,.9],[.45,4.4,.85],[4.45,4.45,.8],[6.55,4.3,.8],[8.55,4.4,.9],[11.55,4.5,.8],[.4,6.45,.75],[4.75,9.0,.9],[11.4,10.3,.95],[11.6,11.6,.8],[9.9,11.4,.85],[11.75,6.45,.7],[10.4,9.9,.9],[4.7,11.6,.8],[.35,8.75,.7],[7.35,6.6,.7],[6.5,9.0,.8]];
    T.forEach(([x, y, s]) => o.push({key:x + y + .2, draw:c => tree(c, x, y, s)}));
    [[4.88,1.5],[6.12,3.2],[1.8,4.88],[9.6,6.12],[4.88,8.6],[6.12,8.6],[10.2,4.88],[2.6,6.12]].forEach(([x, y]) => o.push({key:x + y, draw:c => lamp(c, x, y)}));
    o.push({key:11.0, draw:c => signal(c, 6.32, 4.7, "ew")});
    o.push({key:11.0, draw:c => signal(c, 4.7, 6.32, "ns")});
    return o;
  }
  function pill(id, place, color, status){
    const c = canvas();
    const [X, Y] = c.pt(...place.at);
    const label = place.label;
    const w = Math.round(label.length * 7.1 + (place.locked && status === -1 ? 44 : 34) + (status > 0 ? 14 : 0));
    const x0 = X - w / 2, y0 = Y - 28;
    let s = `<path d="M${X - 5} ${Y - 6.5} L${X} ${Y} L${X + 5} ${Y - 6.5}z" class="pill-tip"/>`;
    s += `<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w}" height="22" rx="11" class="pill-bg"/>`;
    s += `<circle cx="${(x0 + 12).toFixed(1)}" cy="${(y0 + 11).toFixed(1)}" r="4.5" style="fill:${color}"/>`;
    s += `<text x="${(x0 + 22).toFixed(1)}" y="${(y0 + 15.3).toFixed(1)}" class="pill-t">${label}</text>`;
    if (place.locked && status === -1) s += `<g transform="translate(${(x0 + w - 19).toFixed(1)} ${(y0 + 5).toFixed(1)}) scale(.5)" style="fill:none;stroke:var(--muted);stroke-width:2.6;stroke-linecap:round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></g>`;
    if (status > 0) s += `<circle cx="${(x0 + w - 13).toFixed(1)}" cy="${(y0 + 11).toFixed(1)}" r="6.5" style="fill:${status === 2 ? "var(--ok)" : "var(--accent)"}"/><path d="M${(x0 + w - 16).toFixed(1)} ${(y0 + 11).toFixed(1)} l2.2 2.4 l4 -4.6" style="fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/>`;
    return {svg:s, bb:{x0, y0, x1:x0 + w, y1:Y}};
  }
  function city(statusOf, colorOf){
    const base = canvas(); ground(base);
    const items = Object.entries(PLACES).map(([id, p]) => ({key:p.key, id, off:p.off, draw:BLD[id]})).concat(decor());
    items.sort((a, b) => a.key - b.key);
    const bb = {...base.bb};
    const grow = b => { bb.x0 = Math.min(bb.x0, b.x0); bb.y0 = Math.min(bb.y0, b.y0); bb.x1 = Math.max(bb.x1, b.x1); bb.y1 = Math.max(bb.y1, b.y1); };
    let objs = "";
    for (const it of items){
      const c = canvas(); if (it.off){ c.dx = it.off[0]; c.dy = it.off[1]; } it.draw(c); grow(c.bb);
      objs += it.id ? `<g class="bldart" data-id="${it.id}" aria-hidden="true">${c.out.join("")}</g>` : c.out.join("");
    }
    let pills = "";
    for (const [id, p] of Object.entries(PLACES)){
      const pl = pill(id, p, colorOf(id), statusOf(id)); grow(pl.bb);
      pills += `<g class="bld" data-id="${id}" tabindex="0" role="button" aria-label="${p.label}${p.locked && statusOf(id) === -1 ? " – odporúčame najprv prejsť mesto" : ""}">${pl.svg}</g>`;
    }
    const vb = [bb.x0 - 10, bb.y0 - 12, bb.x1 - bb.x0 + 20, bb.y1 - bb.y0 + 24];
    let sky = "";
    let seed = 7; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let k = 0; k < 26; k++){
      const left = k % 2 === 0;
      const x = left ? vb[0] + r() * 150 : vb[0] + vb[2] - r() * 150;
      const y = vb[1] + r() * 110;
      sky += `<circle class="star" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.6 + r() * 1.1).toFixed(1)}" style="animation-delay:${(r() * 3).toFixed(1)}s"/>`;
    }
    const cloud = (x, y, s, d) => `<g class="cloud" style="animation-delay:${d}s"><g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="10" rx="30" ry="9"/><circle cx="-10" cy="4" r="11"/><circle cx="8" cy="0" r="14"/><circle cx="22" cy="7" r="8"/></g></g>`;
    sky += cloud(vb[0] + 70, vb[1] + 36, .9, 0) + cloud(vb[0] + vb[2] - 80, vb[1] + 62, .7, -9);
    const moon = `<g class="moon"><circle cx="${(vb[0] + vb[2] - 46).toFixed(1)}" cy="${(vb[1] + 34).toFixed(1)}" r="13"/><circle cx="${(vb[0] + vb[2] - 40).toFixed(1)}" cy="${(vb[1] + 29).toFixed(1)}" r="11" class="moon-cut"/></g>`;
    const shadowEl = (() => { const p = P(6, 6, -1.2); return `<ellipse cx="${p[0].toFixed(1)}" cy="${(p[1] + 52).toFixed(1)}" rx="175" ry="16" style="fill:var(--shade);filter:blur(7px)"/>`; })();
    return `<svg viewBox="${vb.map(n => n.toFixed(1)).join(" ")}" class="citysvg" role="group" aria-label="Mapa mesta Programovo">${sky}${moon}${shadowEl}${base.out.join("")}<g id="cars"></g>${objs}${pills}</svg>`;
  }
  function thumb(id, size = 52){
    const c = canvas(); BLD[id](c);
    const b = c.bb, pad = 3;
    return `<svg width="${size}" height="${size}" viewBox="${(b.x0 - pad).toFixed(1)} ${(b.y0 - pad).toFixed(1)} ${(b.x1 - b.x0 + 2 * pad).toFixed(1)} ${(b.y1 - b.y0 + 2 * pad).toFixed(1)}" aria-hidden="true">${c.out.join("")}</svg>`;
  }

  /* --- doprava: jazda vpravo, semafor, kolóny --- */
  function traffic(svgEl){
    const carsG = svgEl.querySelector("#cars");
    const L = .62, Wd = .3, RMIN = -1.5, RING = 15;
    const COLORS = ["var(--b1)","var(--b3)","var(--b4)","var(--wall)","var(--b6)","var(--b2)","var(--b5)"];
    // pravá strana: na východ (+x) južný pruh, na západ severný, na juh (+y) západný, na sever východný
    const LANES = [
      {axis:"x", dir:1, lane:5.73, n:3, line:4.18},
      {axis:"x", dir:-1, lane:5.27, n:3, line:6.82},
      {axis:"y", dir:1, lane:5.27, n:2, line:4.18},
      {axis:"y", dir:-1, lane:5.73, n:2, line:6.82}
    ];
    const cars = []; let ci = 0;
    LANES.forEach(ln => { for (let k = 0; k < ln.n; k++){ const s = RMIN + (k + .2 + Math.random() * .4) * RING / ln.n; cars.push({ln, p: ln.dir > 0 ? s : RMIN + RING - (s - RMIN), v:.95 + Math.random() * .35, col:COLORS[ci++ % COLORS.length]}); } });
    const CYCLE = 16;
    const state = (axis, t) => {
      const ph = t % CYCLE;
      if (axis === "x") return ph < 4.6 ? "g" : ph < 5.8 ? "y" : "r";
      return ph >= 8 && ph < 12.6 ? "g" : ph >= 12.6 && ph < 13.8 ? "y" : "r";
    };
    const sigFill = {r:"var(--sig-r)", y:"var(--sig-y)", g:"var(--sig-g)"};
    let last = null, t = 0, prev = {};
    function setSignals(){
      for (const [id, axis] of [["ew","x"],["ns","y"]]){
        const st = state(axis, t);
        if (prev[id] === st) continue; prev[id] = st;
        ["r","y","g"].forEach(k => { const e = svgEl.querySelector(`#sig-${id}-${k}`); if (e) e.style.fill = k === st ? sigFill[k] : "var(--sig-off)"; });
      }
    }
    function step(dt){
      for (const ln of LANES){
        const mine = cars.filter(c => c.ln === ln);
        const prog = c => ln.dir > 0 ? c.p : -c.p;
        const st = state(ln.axis, t);
        for (const car of mine){
          let ahead = Infinity;
          for (const o of mine){ if (o === car) continue; let d = prog(o) - prog(car); if (d <= 0) d += RING; ahead = Math.min(ahead, d); }
          let maxMove = ahead === Infinity ? Infinity : ahead - L - .28;
          const front = car.p + ln.dir * L / 2;
          const toLine = ln.dir > 0 ? ln.line - front : front - ln.line;
          if (st !== "g" && toLine >= -.02){
            if (st === "r" || toLine > .35) maxMove = Math.min(maxMove, Math.max(0, toLine));
          }
          car.p += ln.dir * Math.max(0, Math.min(car.v * dt, maxMove));
          if (ln.dir > 0 && car.p > RMIN + RING) car.p -= RING;
          if (ln.dir < 0 && car.p < RMIN) car.p += RING;
        }
      }
    }
    function draw(){
      const list = cars.map(car => {
        const ln = car.ln;
        const x = ln.axis === "x" ? car.p : ln.lane, y = ln.axis === "x" ? ln.lane : car.p;
        return {car, x, y};
      }).sort((a, b) => (a.x + a.y) - (b.x + b.y));
      let s = "";
      for (const {car, x, y} of list){
        const pos = car.p, edge = Math.min(pos, 12 - pos);
        const op = Math.max(0, Math.min(1, (edge + .25) / .5));
        if (op <= 0) continue;
        const c = canvas();
        const ax = car.ln.axis === "x", d = car.ln.dir;
        const R = (along0, along1, across0, across1, z0, z1, col, o) => ax ? c.box(x + along0, y + across0, x + along1, y + across1, z0, z1, col, o) : c.box(x + across0, y + along0, x + across1, y + along1, z0, z1, col, o);
        R(-L / 2 + .05, L / 2 - .05, -Wd / 2 + .02, Wd / 2 - .02, .0, .09, "#1E2433");
        R(-L / 2, L / 2, -Wd / 2, Wd / 2, .07, .27, car.col);
        const cb0 = d > 0 ? -L * .3 : -L * .12, cb1 = d > 0 ? L * .12 : L * .3;
        R(cb0, cb1, -Wd * .42, Wd * .42, .27, .45, car.col, {left:"var(--glass)", right:"var(--glass2)", top:W(car.col, 70)});
        const hp = ax ? c.pt(x + d * L / 2, y, .18) : c.pt(x, y + d * L / 2, .18);
        c.raw(`<circle class="hl" cx="${hp[0].toFixed(1)}" cy="${hp[1].toFixed(1)}" r="4"/>`);
        s += `<g style="opacity:${op.toFixed(2)}">${c.out.join("")}</g>`;
      }
      carsG.innerHTML = s;
    }
    function frame(ts){
      if (!document.body.contains(svgEl)) return;
      const dt = last == null ? 0 : Math.min(.05, (ts - last) / 1000);
      last = ts; t += dt;
      step(dt); setSignals(); draw();
      requestAnimationFrame(frame);
    }
    if (reduced){ t = 1; setSignals(); draw(); }
    else requestAnimationFrame(frame);
  }
  return {city, thumb, traffic, canvas, W, K, P};
})();

/* ---------- úvodné scény (izometrické) ---------- */
const SCENES = (() => {
  const {canvas, W, K, P} = ISO;
  const f = n => n.toFixed(1);
  function build(fn){
    const parts = [];
    const bb = {x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity};
    const grow = b => { bb.x0 = Math.min(bb.x0, b.x0); bb.y0 = Math.min(bb.y0, b.y0); bb.x1 = Math.max(bb.x1, b.x1); bb.y1 = Math.max(bb.y1, b.y1); };
    const api = {
      P,
      layer(cls, d, draw, extra = ""){
        const c = canvas(); draw(c); grow(c.bb);
        parts.push(`<g class="${cls}" style="--d:${d}s">${extra ? `<g>${c.out.join("")}${extra}</g>` : c.out.join("")}</g>`);
        return c;
      },
      group(cls, d, inner, b){ if (b) grow(b); parts.push(`<g class="${cls}" style="--d:${d}s">${inner}</g>`); },
      pillXY(X, Y, text, color, o = {}){
        const mono = !!o.mono, tip = o.tip !== false;
        const w = text.length * (mono ? 4.5 : 4.35) + (color ? 18 : 12);
        const x0 = X - w / 2, y0 = Y - (tip ? 16.5 : 13);
        grow({x0, y0, x1:x0 + w, y1:Y});
        const s = (tip ? `<path d="M${f(X - 3)} ${f(Y - 3.8)}L${f(X)} ${f(Y)}L${f(X + 3)} ${f(Y - 3.8)}z" class="pill-tip"/>` : "") +
          `<rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="13" rx="6.5" class="pill-bg"/>` +
          (color ? `<circle cx="${f(x0 + 7)}" cy="${f(y0 + 6.5)}" r="2.6" style="fill:${color}"/>` : "") +
          `<text x="${f(color ? x0 + 12.5 : x0 + 6)}" y="${f(y0 + 9.3)}" class="pill-s${mono ? " mono" : ""}">${text}</text>`;
        return s;
      },
      pill(x, y, z, text, color, cls = "s-fade", d = 0, o = {}){ const [X, Y] = P(x, y, z); parts.push(`<g class="${cls}" style="--d:${d}s">${api.pillXY(X, Y, text, color, o)}</g>`); },
      raw(s, b){ if (b) grow(b); parts.push(s); }
    };
    fn(api);

const GLOSS = GLOSS_RAW.map(([id, t, al, y, o, ex, d]) => ({id, t, al, y, o, ex, d}));
const GL_BY_ID = Object.fromEntries(GLOSS.map(g => [g.id, g]));
const normT = s => String(s).toLowerCase().replace(/\s+/g, " ").trim().replace(/[:.,;!?]+$/, "").trim();
const GL_ALIAS = (() => { const m = new Map(); GLOSS.forEach(g => [g.t, ...g.al].forEach(a => m.set(normT(a), g))); return m; })();
function findTerm(text){
  const n = normT(text);
  if (GL_ALIAS.has(n)) return GL_ALIAS.get(n);
  const base = n.replace(/\s*\(.*\)$/, "");
  if (GL_ALIAS.has(base)) return GL_ALIAS.get(base);
  if (n.includes(" ")) return null;
  let best = null, bl = 0;
  for (const [a, g] of GL_ALIAS){
    if (a.includes(" ")) continue;
    let k = 0; while (k < a.length && k < n.length && a[k] === n[k]) k++;
    if (k >= 4 && k >= Math.min(a.length, n.length) - 1 && Math.abs(a.length - n.length) <= 2 && k > bl){ best = g; bl = k; }
  }
  return best;
}

/* ---------- úlohy (spoločné) ---------- */
function taskList(tasks, onAllDone){
  const ul = el("ul", {class:"tasks"});
  let i = 0;
  const api = { ul, get index(){ return i; }, render, advance, current:() => tasks[i] };
  function render(){
    ul.innerHTML = "";
    tasks.forEach((t, k) => {
      const li = el("li", {class: k < i ? "done" : k === i ? "cur" : ""}, el("span", {class:"tick"}, k < i ? "✓" : String(k + 1)), el("div", null, t.text));
      if (k === i && t.choice){
        const box = el("div", {class:"inlineq"});
        const fb = el("div");
        shuffle(t.choice.options).forEach(o => box.append(el("button", {class:"btn small", type:"button", onclick:(e) => {
          if (o === t.choice.correct){ fb.className = "msg ok"; fb.textContent = t.choice.why || "Správne!"; setTimeout(advance, 900); box.querySelectorAll("button").forEach(b => b.disabled = true); }
          else { fb.className = "msg bad"; fb.textContent = t.choice.hint || "Ešte raz. Pozri sa pozorne."; e.currentTarget.classList.add("shake"); }
        }}, o)));
        li.lastChild.append(box, fb);
      }
      ul.append(li);
    });
  }
  function advance(){ i++; render(); if (i >= tasks.length) onAllDone && onAllDone(); }
  render();
  return api;
}

const ACT = {};

/* --- Radnica: mini plocha --- */
ACT.radnica = (mount, done) => {
  const lv = level, adv = lv === "v" || lv === "a";
  const APPS = [
    {id:"kresli", n:"Kreslenie", c:"var(--b3)", ic:"brush"},
    {id:"hudba", n:"Hudba", c:"var(--b4)", ic:"note"},
    {id:"kalk", n:"Kalkulačka", c:"var(--b1)", ic:"calc"},
    {id:"hra", n:"Hra", c:"var(--b5)", ic:"game"},
    {id:"web", n:"Prehliadač", c:"var(--b2)", ic:"globe"},
    {id:"text", n:"Písanie", c:"var(--b6)", ic:"doc"}
  ];
  const DOCS = [{n:"vylet.jpg", app:"kresli", ic:"image"},{n:"pesnicka.mp3", app:"hudba", ic:"note"},{n:"pozvanka.txt", app:"text", ic:"doc"}];
  const CAP = 8;
  APPS.forEach(a => a.ram = adv ? rnd(1, 3) : 1);
  const open = new Map(); // id -> doc name or ""
  let swap = 0;
  const app = id => APPS.find(a => a.id === id);
  const used = () => [...open.keys()].reduce((s, id) => s + app(id).ram, 0);

  let tasks;
  if (lv === "u"){
    const [A, B] = sample(APPS, 2);
    tasks = [
      {text:`Otvor aplikáciu ${A.n}.`, check:() => open.has(A.id)},
      {text:`Otvor aj aplikáciu ${B.n}.`, check:() => open.has(B.id)},
      {text:`Zavri aplikáciu ${A.n}.`, check:() => !open.has(A.id)}
    ];
  } else if (lv === "p"){
    const A = pick(APPS); const D = pick(DOCS); const Dapp = app(D.app);
    tasks = [
      {text:`Spusti aplikáciu ${A.n}.`, check:() => open.has(A.id)},
      {text:`Otvor dokument ${D.n}. Všimni si, ktorá aplikácia sa spustí.`, check:() => open.get(D.app) === D.n},
      {text:`Ktorá aplikácia otvorila dokument ${D.n}?`, choice:{options:shuffle(APPS).slice(0, 3).map(a => a.n).filter(n => n !== Dapp.n).slice(0, 2).concat(Dapp.n), correct:Dapp.n, why:`Áno. Operačný systém vie, že súbory ${D.n.split(".")[1]} otvára aplikácia ${Dapp.n}.`}},
      {text:"Zavri všetky aplikácie – uprac pracovnú plochu.", check:() => open.size === 0}
    ];
  } else {
    // predspustené programy
    const pre = []; let s = 0;
    for (const a of shuffle(APPS)){ if (s + a.ram <= 6 && pre.length < 3){ pre.push(a); s += a.ram; } }
    while (s < 5){ const a = pre.find(x => x.ram < 3); if (!a) break; a.ram++; s++; }
    pre.forEach(a => open.set(a.id, ""));
    const rest = APPS.filter(a => !open.has(a.id));
    const B = rest.sort((x, y) => y.ram - x.ram)[0];
    B.ram = Math.min(4, Math.max(B.ram, CAP - s + 1));
    const sum0 = s;
    const D = pick(DOCS.filter(d => d.app !== B.id));
    tasks = [
      {text:"Pozri sa do správcu úloh. Koľko GB pamäte RAM zaberajú spustené programy?", choice:{options:[...new Set([sum0, sum0 + 1, sum0 - 1, CAP])].map(n => n + " GB"), correct:sum0 + " GB", why:`Správne: ${pre.map(a => a.n + " " + a.ram + " GB").join(" + ")} = ${sum0} GB.`}},
      lv === "v"
        ? {text:`Spusti ${B.n} (potrebuje ${B.ram} GB). Ak sa nezmestí, uvoľni pamäť – zavri čo najmenej programov.`, check:() => open.has(B.id)}
        : {text:`Spusti ${B.n} (potrebuje ${B.ram} GB). Sleduj, čo urobí operačný systém, keď RAM nestačí.`, check:() => open.has(B.id)},
      lv === "v"
        ? {text:`Prečo sa ${B.n} najprv nedal spustiť?`, choice:{options:["V pamäti RAM nebolo dosť miesta.","Disk bol plný hudby.","Procesor nemal rád hry.","Monitor bol vypnutý."], correct:"V pamäti RAM nebolo dosť miesta.", why:"Bežiace programy musia byť v RAM. Keď je plná, OS nový program nespustí."}}
        : {text:"Čo urobil operačný systém, keď sa program nezmestil do RAM?", choice:{options:["Presunul časť pamäte na disk (swap) – počítač je pomalší.","Vymazal iný program z disku.","Vypol procesor.","Program spustil v monitore."], correct:"Presunul časť pamäte na disk (swap) – počítač je pomalší.", why:"Odkladací priestor na disku je oveľa pomalší ako RAM, preto sa počítač spomalí."}},
      lv === "v"
        ? {text:`Otvor dokument ${D.n}.`, check:() => open.get(D.app) === D.n}
        : {text:"Zavri programy tak, aby odkladací priestor (swap) klesol na 0 GB.", check:() => swap === 0 && open.size > 0}
    ];
  }

  const msg = el("div", {class:"msg info"}, "Ťukni na ikonu na ploche.");
  const tl = taskList(tasks, () => { msg.className = "msg ok"; msg.textContent = "Všetky úlohy sú splnené. Operačný systém by ťa zamestnal!"; done(); });
  const checkTask = () => { const t = tl.current(); if (t && t.check && t.check()) { tl.advance(); checkTask(); } };

  const icons = el("div", {class:"icons"});
  const wins = el("div", {class:"wins"});
  const ramBox = el("div", {class:"ram"});
  const cpuBox = el("div", {class:"cpu"});

  function tryOpen(id, docName){
    if (open.has(id)){ if (docName){ open.set(id, docName); msg.className = "msg info"; msg.textContent = `${app(id).n} už beží – dokument ${docName} sa otvoril v jeho okne.`; } render(); checkTask(); return; }
    const a = app(id);
    if (adv && used() + a.ram > CAP){
      if (lv === "v"){
        msg.className = "msg bad";
        msg.innerHTML = `<b>Operačný systém:</b> Pamäť je plná. ${a.n} potrebuje ${a.ram} GB, voľné sú ${CAP - used()} GB. Zavri niektorý program.`;
        render(); return;
      }
      swap = used() + a.ram - CAP;
      msg.className = "msg bad";
      msg.innerHTML = `<b>Operačný systém:</b> RAM nestačí – ${swap} GB presúvam do odkladacieho priestoru na disku. Počítač sa spomalí.`;
    } else {
      msg.className = "msg info";
      msg.textContent = docName ? `Operačný systém spustil ${a.n} a otvoril v ňom ${docName}.` : `Operačný systém spustil ${a.n}.`;
    }
    open.set(id, docName || "");
    if (lv === "a") swap = Math.max(0, used() - CAP);
    render(); checkTask();
  }
  function close(id){
    open.delete(id);
    if (lv === "a") swap = Math.max(0, used() - CAP);
    msg.className = "msg info"; msg.textContent = `${app(id).n} skončila. Operačný systém uvoľnil pamäť.`;
    render(); checkTask();
  }
  APPS.forEach(a => icons.append(el("button", {class:"ico", type:"button", onclick:() => tryOpen(a.id)},
    el("span", {class:"gl", style:`color:${a.c}`, html:icon(a.ic, 22)}), a.n + (adv ? ` · ${a.ram} GB` : ""))));
  if (lv !== "u") DOCS.forEach(dd => icons.append(el("button", {class:"ico doc", type:"button", onclick:() => tryOpen(dd.app, dd.n)},
    el("span", {class:"gl", html:icon(dd.ic, 20)}), dd.n)));

  function render(){
    wins.innerHTML = "";
    if (!open.size) wins.append(el("span", {class:"empty"}, "Žiadne otvorené okno."));
    for (const [id, docName] of open){
      const a = app(id);
      wins.append(el("div", {class:"w win"},
        el("div", {class:"tb", style:`background:${a.c}`}, el("span", null, a.n), el("button", {type:"button", "aria-label":`Zavrieť ${a.n}`, onclick:() => close(id)}, "×")),
        el("div", {class:"wb"}, docName ? `Otvorený dokument: ${docName}` : (adv ? `proces · ${a.ram} GB RAM` : "Aplikácia beží"))));
    }
    if (adv){
      ramBox.innerHTML = "";
      const cells = [];
      for (const id of open.keys()){ const a = app(id); for (let k = 0; k < a.ram; k++) cells.push(a); }
      const track = el("div", {class:"ramtrack"});
      for (let k = 0; k < CAP; k++){ const a = cells[k]; track.append(el("div", {class:"ramcell", style: a ? `background:${a.c};border-style:solid;border-color:transparent` : ""}, a ? a.n.slice(0, 4) : "")); }
      const tbl = el("table", {class:"tm"}, el("thead", null, el("tr", null, el("th", null, "Proces"), el("th", null, "RAM"))),
        el("tbody", null, [...open.keys()].map(id => el("tr", null, el("td", null, app(id).n), el("td", null, app(id).ram + " GB")))));
      ramBox.append(el("div", {class:"eyebrow"}, `Pamäť RAM: ${Math.min(used(), CAP)} / ${CAP} GB` + (lv === "a" ? ` · swap na disku: ${swap} GB` : "")), track,
        el("div", {class:"eyebrow", style:"margin-top:4px"}, "Správca úloh"), tbl);
    }
  }
  // striedanie procesov na procesore
  let tick = 0;
  function cpuLoop(){
    if (!document.body.contains(cpuBox)) return;
    const ids = [...open.keys()];
    cpuBox.innerHTML = "";
    cpuBox.append(el("span", {class:"eyebrow"}, "Procesor práve vykonáva:"));
    ids.forEach((id, k) => cpuBox.append(el("span", {class:"slot" + (k === tick % Math.max(ids.length, 1) ? " on" : ""), style: k === tick % Math.max(ids.length, 1) ? `background:${app(id).c}` : ""}, app(id).n)));
    if (!ids.length) cpuBox.append(el("span", {class:"slot"}, "nič – čaká"));
    tick++;
    setTimeout(cpuLoop, reduced ? 1500 : (swap ? 1100 : 600));
  }
  render();
  mount.append(el("p", null, lv === "u" ? "Toto je pracovná plocha. Splň úlohy." : "Toto je zjednodušená pracovná plocha. Ty si používateľ, radnica je operačný systém."),
    tl.ul, el("div", {class:"desk"}, icons, wins), msg);
  if (adv){ mount.append(ramBox, cpuBox); cpuLoop(); }
};

      D("Hudba", F("pesnicka.mp3","obľúbená pesnička", "4,1 MB"), F("zvoncek.mp3","zvonček", "120 kB")),

  }
  // cesty

    ];
  } else {
    const startDir = ["Dokumenty","Škola","Informatika"];

        const opts = el("div", {class:"inlineq"}); const res = el("div");

          if (o === t.choice.correct){ res.className = "msg ok"; res.textContent = "Presne tak. Cesta = priečinky od koreňa až po súbor."; opts.querySelectorAll("button").forEach(b => b.disabled = true); setTimeout(() => { tl.advance(); msg.className = "msg info"; msg.textContent = "Pokračuj ďalšou úlohou."; }, 1000); }
          else { res.className = "msg bad"; res.textContent = "Nie. Pozri sa na riadok s cestou hore v okne."; e.currentTarget.classList.add("shake"); }

    tl.advance(); render();

  render();
  mount.append(el("div", {class:"bubble"}, el("b", null, "Prípad zmiznutého súboru. "), lv === "u" ? "Niekto pomiešal balíky v sklade. Nájdi ich!" : "Súbory sa stratili v strome priečinkov. Vyšetri to."), tl.ul, fb, msg);
};

    {t:"Pani učiteľka napíše adresu školskej stránky na tabuľu a ty ju otvoríš.", safe:true, why:"Je to známa stránka od dôveryhodného človeka.", lv:"upva"},
    {t:"Antivírus hlási: „Hrozba bola zablokovaná.“", safe:true, why:"Ochrana funguje – hrozbu zastavila. Súbor nespúšťaj a povedz to dospelému.", lv:"upva"},
    {t:"Neznáma stránka ponúka stiahnuť „rýchlejší internet“ ako program.", safe:false, type:"trójsky kôň", why:"Sľub, ktorý znie príliš dobre, často skrýva škodlivý program.", lv:"upva"},
    {t:"E-mail „z banky“ píše, že účet bude zablokovaný, ak sa hneď neprihlásiš cez odkaz.", safe:false, type:"phishing", why:"Banky takto o heslo nežiadajú. Strach a naliehanie sú typické pre phishing.", lv:"va"}

  const deck = sample(S.filter(s => s.lv.includes(lv)), lv === "u" ? 4 : 5);

/* --- Robotická kuchyňa: Bit --- */
ACT.kuchyna = (mount, done) => {
  const lv = level;
  const N = lv === "u" ? 4 : 5;
  const counts = lv !== "u";
  const code = lv === "v" || lv === "a";
  const nItems = code ? 2 : 1;
  const FOODS = [
    {n:"jahodu", s:'<circle cx="12" cy="14" r="7" fill="#E0414F"/><path d="M8 7l4 3 4-3" stroke="#2E9B4F" stroke-width="2.4" fill="none"/>'},
    {n:"mrkvu", s:'<path d="M12 21L7 9h10z" fill="#F08A24"/><path d="M10 9l-2-5M12 9V3M14 9l2-5" stroke="#2E9B4F" stroke-width="2"/>'},
    {n:"syr", s:'<path d="M4 17l16-8v8z" fill="#F2C33B"/><circle cx="12" cy="14" r="1.5" fill="#D29B12"/><circle cx="16" cy="15" r="1" fill="#D29B12"/>'},
    {n:"chlieb", s:'<path d="M5 12a7 5 0 0114 0v7H5z" fill="#C98A4A"/><path d="M9 11l1 2M12 10l1 2M15 11l1 2" stroke="#8C5523" stroke-width="1.5"/>'}
  ];
  const NAMES = {F:"krok", L:"otoč sa vľavo", R:"otoč sa vpravo", T:"vezmi"};
  const PY = {F:"krok()", L:"vlavo()", R:"vpravo()", T:"vezmi()"};
  let level0;
  function gen(){
    for (let tries = 0; tries < 200; tries++){
      const walls = new Set();
      const start = {x:0, y:rnd(0, N - 1), d:0};
      const nW = lv === "u" ? rnd(1, 2) : rnd(3, 5);
      while (walls.size < nW){ const x = rnd(1, N - 1), y = rnd(0, N - 1); walls.add(x + "," + y); }
      const free = [];
      for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!walls.has(x + "," + y) && !(x === start.x && y === start.y)) free.push({x, y});
      const items = sample(free.filter(c => Math.abs(c.x - start.x) + Math.abs(c.y - start.y) >= (lv === "u" ? 2 : 3)), nItems);
      if (items.length < nItems) continue;
      // dosiahnuteľnosť
      const seen = new Set([start.x + "," + start.y]); const q = [start];
      while (q.length){ const c = q.shift(); [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => { const nx = c.x + dx, ny = c.y + dy, k = nx + "," + ny; if (nx >= 0 && ny >= 0 && nx < N && ny < N && !walls.has(k) && !seen.has(k)){ seen.add(k); q.push({x:nx, y:ny}); } }); }
      if (items.every(it => seen.has(it.x + "," + it.y))){
        const foods = sample(FOODS, nItems);
        return {walls, start, items:items.map((it, k) => ({...it, f:foods[k], taken:false}))};
      }
    }
    return {walls:new Set(), start:{x:0, y:0, d:0}, items:[{x:N - 1, y:N - 1, f:FOODS[0], taken:false}]};
  }
  level0 = gen();
  let prog = [];
  let bot = {...level0.start}, running = false, ptr = 0, seq = [], timer = null;

  const gridEl = el("div", {class:"grid", style:`grid-template-columns:repeat(${N}, 1fr)`});
  const botEl = el("div", {class:"botwrap"});
  botEl.innerHTML = `<svg viewBox="0 0 40 40" aria-label="Robot Bit"><rect x="6" y="9" width="28" height="24" rx="7" fill="var(--b1)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="15" cy="20" r="3.5" fill="var(--window)"/><circle cx="26" cy="20" r="3.5" fill="var(--window)"/><path d="M34 21l5 0" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M20 4v5" stroke="var(--ink)" stroke-width="2"/><circle cx="20" cy="4" r="2" fill="var(--accent)"/></svg>`;
  const progEl = el("div", {class:"prog", "aria-label":"Program"});
  const codeEl = el("pre", {class:"code", "aria-label":"Program v Pythone"});
  const msg = el("div", {class:"msg info"}, nItems > 1 ? `Bit má vziať ${level0.items.map(i => i.f.n).join(" aj ")}. Poskladaj program z príkazov.` : `Bit má vziať ${level0.items[0].f.n}. Poskladaj program z príkazov.`);

  function drawGrid(){
    gridEl.innerHTML = "";
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      const k = x + "," + y; const it = level0.items.find(i => i.x === x && i.y === y && !i.taken);
      gridEl.append(el("div", {class:"cell" + (level0.walls.has(k) ? " wall" : "") + (x === level0.start.x && y === level0.start.y ? " start" : ""), html: it ? `<svg viewBox="0 0 24 24" width="70%" height="70%" aria-label="${it.f.n}">${it.f.s}</svg>` : ""}));
    }
    gridEl.append(botEl); placeBot();
  }
  function placeBot(){
    const cell = `((100% - 12px - ${4 * (N - 1)}px) / ${N})`;
    botEl.style.left = `calc(6px + ${bot.x} * (${cell} + 4px))`;
    botEl.style.top = `calc(6px + ${bot.y} * (${cell} + 4px))`;
    botEl.style.width = `calc${cell}`; botEl.style.height = `calc${cell}`;
    botEl.querySelector("svg").style.transform = `rotate(${bot.d * 90}deg)`;
  }
  function lines(){
    const out = [];
    prog.forEach((b, i) => { if (b.n > 1){ out.push({t:`for i in range(${b.n}):`, b:i}); out.push({t:"    " + PY[b.c], b:i}); } else out.push({t:PY[b.c], b:i}); });
    return out;
  }
  function drawProg(active = -1){
    progEl.innerHTML = "";
    if (!prog.length) progEl.append(el("span", {class:"why"}, "Program je prázdny. Pridaj príkazy farebnými tlačidlami vyššie."));
    prog.forEach((b, i) => {
      const blk = el("span", {class:`blk c-${b.c}` + (i === active ? " run" : "")}, el("span", null, NAMES[b.c]));
      if (counts && b.c !== "T"){
        blk.append(el("button", {type:"button", "aria-label":"Menej opakovaní", disabled:running, onclick:() => { b.n = Math.max(1, b.n - 1); drawProg(); }}, "−"),
          el("span", {class:"n"}, "×" + b.n),
          el("button", {type:"button", "aria-label":"Viac opakovaní", disabled:running, onclick:() => { b.n = Math.min(9, b.n + 1); drawProg(); }}, "+"));
      }
      blk.append(el("button", {type:"button", "aria-label":"Odstrániť príkaz", disabled:running, onclick:() => { prog.splice(i, 1); drawProg(); }}, "×"));
      progEl.append(blk);
    });
    if (code){
      codeEl.innerHTML = "";
      const ls = lines();
      if (!ls.length) codeEl.append(el("span", {class:"ln"}, "# tu sa objaví program v Pythone"));
      ls.forEach(l => codeEl.append(el("span", {class:"ln" + (l.b === active ? " on" : "")}, l.t)));
    }
  }
  const palette = el("div", {class:"palette"});
  ["F","L","R","T"].forEach(c => palette.append(el("button", {class:`cmd c-${c}`, type:"button", onclick:() => {
    if (running) return;
    if (prog.length >= 16){ msg.className = "msg bad"; msg.textContent = "Program je príliš dlhý. Skús použiť opakovanie."; return; }
    const last = prog[prog.length - 1];
    if (counts && last && last.c === c && c !== "T" && last.n < 9) last.n++; else prog.push({c, n:1});
    drawProg();
  }}, "+ " + NAMES[c])));

  function reset(){ clearTimeout(timer); running = false; ptr = 0; bot = {...level0.start}; level0.items.forEach(i => i.taken = false); drawGrid(); drawProg(); setBtns(); }
  function expand(){ const s = []; prog.forEach((b, i) => { for (let k = 0; k < b.n; k++) s.push({c:b.c, bi:i}); }); return s; }
  function stepOnce(){
    const ins = seq[ptr];
    if (!ins) return finish();
    drawProg(ins.bi);
    const DX = [1,0,-1,0], DY = [0,1,0,-1];
    if (ins.c === "F"){
      const nx = bot.x + DX[bot.d], ny = bot.y + DY[bot.d];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N || level0.walls.has(nx + "," + ny)){
        botEl.classList.add("shake"); setTimeout(() => botEl.classList.remove("shake"), 400);
        msg.className = "msg bad"; msg.innerHTML = `<b>Bum!</b> Bit narazil ${nx < 0 || ny < 0 || nx >= N || ny >= N ? "do steny kuchyne" : "do linky"}. Urobil presne to, čo stálo v programe – v ${ptr + 1}. kroku. Oprav program.`;
        running = false; setBtns(); return "stop";
      }
      bot.x = nx; bot.y = ny;
    } else if (ins.c === "L") bot.d = (bot.d + 3) % 4;
    else if (ins.c === "R") bot.d = (bot.d + 1) % 4;
    else if (ins.c === "T"){
      const it = level0.items.find(i => i.x === bot.x && i.y === bot.y && !i.taken);
      if (it){ it.taken = true; drawGrid(); msg.className = "msg info"; msg.textContent = `Bit vzal ${it.f.n}.`; }
      else { msg.className = "msg bad"; msg.textContent = "Bit sa pokúsil niečo vziať, ale na tomto políčku nič nie je. Bit nehľadá – vezme len to, čo je priamo pod ním."; }
    }
    placeBot();
    ptr++;
    if (ptr >= seq.length) return finish();
  }
  function finish(){
    running = false; setBtns(); drawProg();
    const left = level0.items.filter(i => !i.taken);
    if (!left.length){ msg.className = "msg ok"; msg.innerHTML = `<b>Hotovo!</b> Program funguje. Mal ${prog.length} ${prog.length === 1 ? "blok" : prog.length < 5 ? "bloky" : "blokov"}.` + (code ? " Vieš ho napísať kratšie pomocou opakovania?" : ""); done(); return "end"; }
    const onIt = left.find(i => i.x === bot.x && i.y === bot.y);
    msg.className = "msg bad";
    msg.textContent = onIt ? `Bit stojí pri jedle, ale nevzal ho. V programe chýba príkaz „vezmi“. Bit nehádá, čo chceš.` : "Program skončil, ale Bit ešte nemá všetko. Skontroluj poradie a počet krokov.";
    return "end";
  }
  function run(){
    if (!prog.length){ msg.className = "msg bad"; msg.textContent = "Program je prázdny – Bit nemá čo robiť."; return; }
    reset(); seq = expand(); running = true; setBtns();
    msg.className = "msg info"; msg.textContent = "Bit vykonáva program…";
    const loop = () => { if (!running) return; const r = stepOnce(); if (r) return; timer = setTimeout(loop, reduced ? 120 : 480); };
    timer = setTimeout(loop, 200);
  }
  function stepBtn(){
    if (!prog.length) return;
    if (ptr === 0 || ptr >= seq.length){ const p = prog; reset(); prog = p; seq = expand(); }
    const r = stepOnce();
    if (!r){ msg.className = "msg info"; msg.textContent = `Krokovanie: vykonaný ${ptr}. krok z ${seq.length}.`; }
    else if (r === "stop") ptr = 0;
  }
  const bRun = el("button", {class:"btn primary", type:"button", onclick:run, html:icon("play", 16) + " Spustiť"});
  const bStep = el("button", {class:"btn", type:"button", onclick:stepBtn, html:icon("step", 16) + " Krokovať"});
  const bReset = el("button", {class:"btn", type:"button", onclick:() => { reset(); msg.className = "msg info"; msg.textContent = "Bit je späť na štarte."; }, html:icon("reset", 16) + " Na štart"});
  const bClear = el("button", {class:"btn", type:"button", onclick:() => { prog = []; reset(); }}, "Vymazať program");
  const bNew = el("button", {class:"btn", type:"button", onclick:() => { level0 = gen(); prog = []; reset(); msg.className = "msg info"; msg.textContent = `Nová kuchyňa! Bit má vziať ${level0.items.map(i => i.f.n).join(" aj ")}.`; }}, "Nová kuchyňa");
  function setBtns(){ [bRun, bStep, bClear, bNew].forEach(b => b.disabled = running); }
  drawGrid(); drawProg(); setBtns();
  mount.append(
    el("div", {class:"legend2"},
      el("span", null, el("i", {class:"lg lg-start"}), "štart Bita"),
      el("span", null, el("i", {class:"lg lg-wall"}), "linka – sem Bit nesmie"),
      el("span", null, el("i", {class:"lg lg-nose"}), "oranžový nos = kam sa Bit pozerá")),
    el("div", {class:"kitchen"},
      gridEl,
      el("div", {style:"display:grid;gap:10px;align-content:start;min-width:0"},
        el("div", {class:"eyebrow"}, "Príkazy"), palette,
        el("div", {class:"eyebrow"}, counts ? "Program (číslo ×n = opakuj n-krát)" : "Program"), progEl,
        code ? el("div", null, el("div", {class:"eyebrow", style:"margin-bottom:4px"}, "Ten istý program v Pythone"), codeEl) : null,
        el("div", {class:"ctrl"}, bRun, bStep, bReset), el("div", {class:"ctrl"}, bClear, bNew))),
    msg);
};

  const STEPS = {
    u:[["Ty","Ťukneš prstom na tlačidlo „Ulož“.","vstup"],["Obrazovka","Dotykový displej zachytí dotyk.","vstup"],["Program","Program zistí, čo chceš, a obrázok uloží.","app"],["Obrazovka","Obrazovka ukáže: Uložené!","out"]],

    v:[["Myš","Myš pošle signál o kliknutí.","vstup"],["Ovládač","Ovládač myši preloží signál pre operačný systém.","ovl"],["Operačný systém","OS zistí, ktoré okno je pod kurzorom, a pošle mu udalosť „klik“.","os"],["Aplikácia","Aplikácia spustí časť programu pre „Uložiť“.","app"],["Procesor a RAM","Procesor vykonáva inštrukcie, údaje dokumentu sú v RAM.","hw"],["Disk","Operačný systém zapíše súbor na disk.","hw"],["Obrazovka","Obrazovka ukáže hlásenie „Uložené“.","out"]],
    a:[["Hardvér","Radič myši vyvolá prerušenie (interrupt).","vstup"],["Jadro OS","Procesor odloží rozpracovanú prácu a spustí obsluhu prerušenia v jadre.","os"],["Ovládač","Ovládač myši vytvorí udalosť „klik na súradniciach x, y“.","ovl"],["Správca okien","Správca okien doručí udalosť procesu, ktorého okno je navrchu.","os"],["Aplikácia","Cyklus udalostí aplikácie zavolá funkciu ulozit().","app"],["Systémové volanie","Aplikácia požiada OS systémovým volaním o zápis súboru.","os"],["Súborový systém","Súborový systém a ovládač disku zapíšu dáta na disk.","hw"],["Grafika","Aplikácia prekreslí okno, grafická karta pošle obraz na monitor.","out"]]
  }[lv];
  let phase = "watch", cur = -1, timer = null;
  const box = el("div", {style:"display:grid;gap:12px"});
  mount.append(box);
  function watch(){
    box.innerHTML = "";
    const layers = el("div", {class:"layers"});
    STEPS.forEach((s, i) => layers.append(el("div", {class:"layer" + (i === cur ? " on" : i < cur ? " past" : ""), style:`border-left:6px solid ${C[s[2]]}`}, el("b", null, s[0]), el("span", null, s[1]))));
    const bPlay = el("button", {class:"btn", type:"button", onclick:play, html:icon("play", 16) + " Prehrať"});
    const bNext = el("button", {class:"btn", type:"button", onclick:() => { clearTimeout(timer); cur = Math.min(cur + 1, STEPS.length - 1); watch(); }, html:icon("step", 16) + " Ďalší krok"});
    const bGo = el("button", {class:"btn primary", type:"button", disabled: cur < STEPS.length - 1, onclick:() => { phase = "order"; order(); }}, "Poskladaj cestu sám");
    box.append(el("p", null, "Sleduj, kadiaľ putuje jedno kliknutie. Potom poskladáš cestu sám."), layers, el("div", {class:"ctrl"}, bPlay, bNext, bGo));

  function order(){
    box.innerHTML = "";
    let placed = 0;
    const target = el("div", {class:"layers"});
    const fb = el("div", {class:"msg info"}, "Ťukaj na kroky v správnom poradí – od kliknutia po výsledok.");
    const pool = el("div", {class:"order"});
    const draw = () => { target.innerHTML = ""; STEPS.slice(0, placed).forEach(s => target.append(el("div", {class:"layer on", style:`border-left:6px solid ${C[s[2]]}`}, el("b", null, s[0]), el("span", null, s[1])))); };
    shuffle(STEPS.map((s, i) => ({s, i}))).forEach(({s, i}) => pool.append(el("button", {class:"opt", type:"button", onclick:(e) => {

        if (placed === STEPS.length){ fb.className = "msg ok"; fb.textContent = "Cesta je kompletná! Toto všetko sa stane za zlomok sekundy."; box.append(el("button", {class:"btn", type:"button", onclick:() => { phase = "watch"; cur = -1; watch(); }, html:icon("reset", 16) + " Pozrieť znova"})); done(); }

    }}, el("b", null, s[0] + ": "), s[1])));
    box.append(target, fb, pool);
  }
  watch();
};

function renderQuiz(mount, id){
  const pool = QUIZ[id].filter(x => x.lv.includes(level));
  const n = Math.min(level === "u" ? 3 : 4, pool.length);
  const qs = sample(pool, n).map(x => {
    if (x.gen) return x.gen();
    return {q:pick(x.q), a:x.a, w:x.w, why:x.why};
  });
  mount.innerHTML = "";
  let answered = 0, right = 0;
  const result = el("div");
  qs.forEach((q, k) => {
    const opts = el("div", {class:"opts"});
    const why = el("p", {class:"why", hidden:true});
    const qt = el("p", {class:"qt"});
    const parts = q.q.split("\n");
    qt.append(`${k + 1}. ` + parts[0]);
    const card = el("div", {class:"q"}, qt);
    if (parts.length > 1) card.append(el("pre", {class:"code"}, parts.slice(1).map(l => el("span", {class:"ln"}, l))));
    shuffle([q.a, ...q.w.slice(0, 3)]).forEach(o => opts.append(el("button", {class:"qo", type:"button", onclick:(e) => {
      opts.querySelectorAll("button").forEach(b => { b.disabled = true; if (b.dataset.v === q.a) b.classList.add("right"); });
      if (o !== q.a) e.currentTarget.classList.add("wrong"); else right++;
      why.hidden = false; why.textContent = (o === q.a ? "Správne. " : "Správna odpoveď je zvýraznená. ") + q.why;
      answered++;
      if (answered === qs.length) finish();
    }, "data-v":o}, o)));
    card.append(opts, why);
    mount.append(card);
  });
  function finish(){
    const p = pr(id);
    if (!p.quizMax || right / qs.length >= p.quiz / p.quizMax){ p.quiz = right; p.quizMax = qs.length; }
    saveProgress();
    const good = right >= Math.ceil(qs.length * .75);
    result.className = good ? "msg ok" : "msg bad";
    result.innerHTML = "";
    result.append(el("p", {class:"score"}, `${right} z ${qs.length}`), el("p", null, good ? "Kvíz je splnený." : "Na splnenie treba aspoň 3 správne odpovede zo 4. Skús nové otázky."),
      el("div", {style:"margin-top:8px"}, el("button", {class:"btn small", type:"button", onclick:() => renderQuiz(mount, id), html:icon("reset", 16) + " Nové otázky"})));
  }
  mount.append(result);
}

const Tutor = (() => {
  let sp = null;
  const getSample = () => {
    if (!sp) sp = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
    return sp;
  };
  let blocked = false;

  async function ask(turns, onText, signal){

    }

    }

})();
